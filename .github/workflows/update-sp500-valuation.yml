name: Update S&P 500 valuation data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 5"

permissions:
  contents: write

concurrency:
  group: dashboard-data-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-sp500-valuation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update S&P 500 valuation JSON
        run: python scripts/update-sp500-valuation.py

      - name: Validate datasets and refresh manifest
        run: python scripts/validate-data.py --write-manifest --fail-on sp500-valuation --strict-freshness

      - name: Publicar diagnóstico em português
        if: always()
        run: python scripts/write-action-summary.py

      - name: Commit updated data
        run: python scripts/publish-data.py --message "Update S&P 500 valuation data" data/sp500-valuation.json
