name: Update ETF geography data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 20 * *"

permissions:
  contents: write

concurrency:
  group: dashboard-data-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-etf-geography:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python -m pip install pypdf==6.10.0

      - name: Update ETF geography JSON
        run: python scripts/update-etf-geography.py

      - name: Validate datasets and refresh manifest
        run: python scripts/validate-data.py --write-manifest --fail-on etf-geography

      - name: Publicar diagnóstico em português
        if: always()
        run: python scripts/write-action-summary.py

      - name: Commit updated data
        run: python scripts/publish-data.py --message "Update ETF geography data" data/etf-geography.json
