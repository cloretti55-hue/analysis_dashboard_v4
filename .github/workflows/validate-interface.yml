name: Validate dashboard interface

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/validate-interface.py"
      - ".github/workflows/validate-interface.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "scripts/validate-interface.py"
      - ".github/workflows/validate-interface.yml"

permissions:
  contents: read

concurrency:
  group: validate-dashboard-interface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser test dependency
        run: python -m pip install playwright==1.61.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate desktop and mobile interface
        run: python scripts/validate-interface.py
