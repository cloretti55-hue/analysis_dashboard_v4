name: Update Fed policy data

on:
  workflow_dispatch:
  schedule:
    - cron: "55 11 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dashboard-data-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-fed-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Fed policy JSON
        run: python scripts/update-fed-policy.py

      - name: Validate datasets and refresh manifest
        run: python scripts/validate-data.py --write-manifest --fail-on fed-policy

      - name: Publicar diagnóstico em português
        if: always()
        run: python scripts/write-action-summary.py

      - name: Commit updated data
        run: python scripts/publish-data.py --message "Update Fed policy data" data/fed-policy.json
